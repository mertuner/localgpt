[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 5 requires Node 18+; pin so builds don't drift with Netlify defaults.
  NODE_VERSION = "20"

# No /api proxy here on purpose. Netlify buffers server-sent events, which
# delayed the first token by ~26s versus 0.34s calling the backend directly.
# The browser therefore talks straight to VITE_API_BASE_URL (see .env.production)
# and the backend sends CORS headers.

# Single-page app: serve index.html for any path that isn't a real file,
# so deep links and reloads don't 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed asset filenames are content-addressed, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must never be cached, or clients keep booting old bundles.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
