<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout extend under the iPhone home indicator,
         which we then pad back with env(safe-area-inset-*). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#212121" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Kept for older iOS, which does not yet read the standard name above. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Local LLM" />
    <meta name="description" content="Chat with a local Gemma model." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Local LLM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
